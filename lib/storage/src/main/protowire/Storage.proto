syntax = "proto3";

package signal;

option java_package = "org.signal.storage.protos";

message SignalStoreList {
    repeated string contents = 1;
}

message RemoteConfigOverrides {
    map<string, string> valueByKey = 1;
}

// Field-for-field copy of SubmitCallQualitySurveyRequest so previously stored values still decode.
message CallQualitySurveyRequest {
    bool           user_satisfied                  = 1;
    repeated string call_quality_issues            = 2;
    optional string additional_issues_description  = 3;
    optional string debug_log_url                  = 4;
    int64          start_timestamp                 = 5;
    int64          end_timestamp                   = 6;
    string         call_type                       = 7;
    bool           success                         = 8;
    string         call_end_reason                 = 9;
    optional float connection_rtt_median           = 10;
    optional float audio_rtt_median                = 11;
    optional float video_rtt_median                = 12;
    optional float audio_recv_jitter_median        = 13;
    optional float video_recv_jitter_median        = 14;
    optional float audio_send_jitter_median        = 15;
    optional float video_send_jitter_median        = 16;
    optional float audio_recv_packet_loss_fraction = 17;
    optional float video_recv_packet_loss_fraction = 18;
    optional float audio_send_packet_loss_fraction = 19;
    optional float video_send_packet_loss_fraction = 20;
    optional bytes call_telemetry                  = 21;
}

message StorageSyncLoopState {
    repeated sint32 recentFingerprints = 1;
    uint32 contentLevel                = 2;
    uint64 contentLevelAsOf            = 3;
    uint32 rateLevel                   = 4;
    uint64 rateLevelAsOf               = 5;
}

message LocalRegistrationMetadata {
    bytes aciIdentityKeyPair = 1;
    bytes aciSignedPreKey = 2;
    bytes aciLastRestoreKyberPreKey = 3;
    bytes pniIdentityKeyPair = 4;
    bytes pniSignedPreKey = 5;
    bytes pniLastRestoreKyberPreKey = 6;
    string aci = 7;
    string pni = 8;
    bool hasPin = 9;
    optional string pin = 10;
    optional bytes masterKey = 11;
    string e164 = 12;
    bool fcmEnabled = 13;
    string fcmToken = 14;
    bytes profileKey = 15;
    string servicePassword = 16;
    bool reglockEnabled = 17;
    LinkedDeviceInfo linkedDeviceInfo = 18;
}

message LinkedDeviceInfo {
    uint32 deviceId = 1;
    string deviceName = 2;
    optional bytes ephemeralBackupKey = 3;
    optional string accountEntropyPool = 4;
    optional bytes mediaRootBackupKey = 5;
}

message RestoreDecisionState {
    enum State {
        START = 0;
        INTEND_TO_RESTORE = 1;
        NEW_ACCOUNT = 2;
        SKIPPED = 3;
        COMPLETED = 4;
    }

    message IntendToRestoreData {
        bool hasOldDevice = 1;
        optional bool fromRemote = 2;
        optional bool fromLocalV2 = 3;
    }

    State decisionState = 1;
    optional IntendToRestoreData intendToRestoreData = 2;
}
